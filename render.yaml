services:
  - type: web
    name: github-slack-dm
    runtime: docker
    # The free plan sleeps when idle and cold starts take longer than
    # GitHub's 10-second webhook timeout, so deliveries would be dropped.
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    dockerfilePath: ./slack-dm-bot/Dockerfile
    dockerContext: ./slack-dm-bot
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - slack-dm-bot/**
    envVars:
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_USER_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
