display_information:
  name: GitHub DM
  description: DMs you about GitHub review requests and PR feedback.
  background_color: "#0284c7"
features:
  bot_user:
    display_name: GitHub DM
    always_online: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - chat:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
